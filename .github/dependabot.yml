# Dependabot — supply-chain hygiene with a cooldown window.
#
# Per the syniron CLAUDE.md "Repo defaults": every repo gets a weekly
# bump cadence and a per-ecosystem `cooldown:` block. The cooldown is
# the tension between (a) waiting long enough that a freshly-published
# malicious version has a chance of being flagged, and (b) not letting
# us sit on stale versions forever. default-days: 7 is the global bar.
#
# This is the first-implementation reference config for the syniron
# rollout (cavbot2 + 7 others copy this shape).
#
# Minor + patch updates are grouped per ecosystem: it keeps PR volume down,
# and — more importantly here — it stops Dependabot splitting packages that
# must move together. react and react-dom demand an exact version match, and
# as separate PRs both halves fail CI. Majors stay ungrouped so they get
# scrutinized individually; `dependabot-auto-merge.yml` also keys off that
# split and never auto-merges a major.

version: 2
updates:
  # Frontend (Vite + React + TS) and e2e (Playwright). Both directories
  # have their own pnpm-lockfiles; `directories:` (plural) covers both
  # under one entry.
  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/e2e"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # Every action in .github/workflows/ is SHA-pinned, so nothing surfaces a
  # stale pin on its own — this entry is the only thing watching them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # Dockerfile base images (node:24-alpine, caddy:2-alpine).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # docker-compose service image pins (postgres:16-alpine,
  # ghcr.io/umami-software/umami:postgresql-latest, cloudflare/cloudflared).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compose-minor-patch:
        update-types:
          - "minor"
          - "patch"
