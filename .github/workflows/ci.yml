name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + vitest + playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      # Cache the ~50MB CCP SDE zip across runs. scripts/build-sde.ts
      # already self-invalidates after 7 days, so the same key is safe to
      # keep — a stale entry will just trigger one re-download.
      - name: Cache SDE zip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/scripts/cache
          key: freightdesk-sde-zip-v1

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install e2e deps
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      # `pnpm build` chains: build:sde → build:services → tsc -b → vite build.
      # This is also our typecheck gate.
      - name: Build web (SDE + services + tsc + vite)
        working-directory: web
        run: pnpm build

      - name: Run vitest
        working-directory: web
        run: pnpm test

      - name: Install Playwright Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke
        working-directory: e2e
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  image-build:
    name: docker image build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
